name: panda_fit
description: "PandaFit - High-precision Health, Weight, Body Composition, Nutrition & Workout Tracking Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Backend & Auth
  supabase_flutter: ^2.5.6

  # Data Visualization & Charts
  fl_chart: ^0.68.0

  # Storage & Offline Cache
  shared_preferences: ^2.2.3

  # Icons & Media
  lucide_icons: ^0.257.0

  # Date & Number Formatting
  intl: ^0.20.2

  # Utilities
  uuid: ^4.4.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/recipes/
    - assets/icons/
    - assets/images/
